<style>

}

  --s:#ff9850;--s-bg:#33251a;--ts:#f23645;--ts-bg:#331b20;--accent:#5b8dff;--accent-bg:#1c2b4d;
  --warn:#e8c06a;--warn-bg:#2e2715;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#11151f;--surface:#1e222d;--surface2:#262b38;--text:#d1d4dc;--muted:#868b98;--line:#2a2e39;
  --tb:#0a9e85;--tb-bg:#0d2f2a;--b:#26a69a;--b-bg:#0e2b29;--h:#868b98;--h-bg:#272c3a;
  --s:#ff9850;--s-bg:#33251a;--ts:#f23645;--ts-bg:#331b20;--accent:#5b8dff;--accent-bg:#1c2b4d;

html{-webkit-text-size-adjust:100%}

@media (max-width:700px){
  #pftab{min-width:700px}
  #tb th:nth-child(7),#tb td:nth-child(7),#tb th:nth-child(11),#tb td:nth-child(11),#tb th:nth-child(12),#tb td:nth-child(12),#tb th:nth-child(13),#tb td:nth-child(13),#tb th:nth-child(14),#tb td:nth-child(14),#tb th:nth-child(15),#tb td:nth-child(15),#tb th:nth-child(16),#tb td:nth-child(16),#tb th:nth-child(17),#tb td:nth-child(17),#tb th:nth-child(20),#tb td:nth-child(20){display:none}

<body>
<div class="wrap">
<header>
  <div class="brand"><h1>Signal Desk</h1><div class="dots" id="mdots"></div></div>
  <div class="hright"><div class="asof" id="clock"></div><select id="arSel" aria-label="Auto-refresh" style="background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:38px;color:var(--text)"><option value="0">Auto: off</option><option value="5">Auto: 5 min</option><option value="10">Auto: 10 min</option><option value="30">Auto: 30 min</option></select><button class="btn" id="rfBtn" type="button">↻ Refresh prices</button></div>
</header>
<div class="subhead"><div class="asof" id="asof"></div><div id="rfMsg"></div></div>
<div class="wrap"><details id="pxBox" style="font-size:12px;margin:2px 0 4px"><summary class="mut" style="cursor:pointer">Data source</summary><div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><input id="pxIn" placeholder="Optional proxy URL (https://…workers.dev)" style="min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--text)"><button class="btn ghost" id="pxSave" type="button">Save</button></div><div class="mut" style="margin-top:4px">Prices come straight from Yahoo Finance. If your browser blocks that, deploy the free worker.js from this repo on Cloudflare and paste its URL here.</div></details></div>
<div id="banners"></div>

<div class="tabs" role="tablist" id="tabs"></div>

<div class="card tools" id="tools">
  <label>Moving average days<input id="maN" type="number" min="2" max="120" step="1" value="50" inputmode="numeric"></label>
  <label>Type<select id="maT"><option>SMA</option><option>EMA</option></select></label>
  <div class="mut" style="font-size:12px;max-width:430px" id="maHelp"></div>
</div>

<div id="view"></div>
<div class="foot" id="foot"></div>
</div>
<dialog id="dlg"><div id="dc"></div></dialog>

<script id="engine">
// Signal engine v2: pure functions, no DOM. Works for any market.
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const pct = (a, b) => (b ? ((a - b) / b) * 100 : 0);
const rnd = (x, d = 2) => Math.round(x * 10 ** d) / 10 ** d;

function mkRec(sym, a, fields) {
  const o = { sym, name: a[0] };
  fields.forEach((f, i) => (o[f] = a[i + 1]));
  o.closes = a[fields.length + 1] || [];
  o.bars = a[fields.length + 2] || null;
  return o;
}

// moving averages on closes (last completed daily bars)
function smaSeries(c, n) {
  const out = new Array(c.length).fill(null);
  if (n < 1 || c.length < n) return out;
  let s = 0;
  for (let i = 0; i < c.length; i++) {
    s += c[i];
    if (i >= n) s -= c[i - n];
    if (i >= n - 1) out[i] = s / n;
  }
  return out;
}
function emaSeries(c, n) {
  const out = new Array(c.length).fill(null);
  if (n < 1 || c.length < n) return out;
  const k = 2 / (n + 1);
  let e = c.slice(0, n).reduce((a, b) => a + b, 0) / n;
  out[n - 1] = e;
  for (let i = n; i < c.length; i++) { e = c[i] * k + e * (1 - k); out[i] = e; }
  return out;
}
function maInfo(s, n, type) {
  const c = s.closes;
  if (!c.length || c.length < n) return null;
  const ser = type === 'EMA' ? emaSeries(c, n) : smaSeries(c, n);
  const v = ser[ser.length - 1];
  const prevV = ser[ser.length - 2];
  const prevClose = c[c.length - 2];
  const above = s.px > v;
  const prevAbove = prevV != null ? prevClose > prevV : above;
  return { v, diff: pct(s.px, v), above, crossed: above !== prevAbove ? (above ? 'up' : 'down') : null, ser };
}

function template(s, bm) {
  const c = s.closes || [];
  let slowRising = null;
  if (c.length >= 121) { const ser = smaSeries(c, 100), a = ser[ser.length - 1], b = ser[ser.length - 22]; if (a != null && b != null) slowRising = a > b; }
  const items = [
    ['Price above the 100- and 200-day averages', s.px > s.sma100 && s.px > s.sma200],
    ['100-day average above the 200-day', s.sma100 > s.sma200],
    ['50-day average above the 100- and 200-day', s.sma50 > s.sma100 && s.sma50 > s.sma200],
    ['Price above the 50-day average', s.px > s.sma50],
    ['100-day average rising for at least a month', slowRising === null ? s.sma50 > s.sma100 : slowRising],
    ['At least 25% above the 52-week low', s.px >= s.lo52 * 1.25],
    ['Within 25% of the 52-week high', s.px >= s.hi52 * 0.75],
    ['Beating the market index (60- or 120-day return)', (s.r60 - bm.r60) > 0 || (s.r120 - bm.r120) > 0]
  ];
  return {items, pass: items.filter(x => x[1]).length};
}

function score(s, bm, etf) {
  const parts = {}, why = [];
  let t = 0;
  t += s.px > s.sma20 ? 5 : -5;
  t += s.px > s.sma50 ? 7 : -7;
  t += s.px > s.sma100 ? 6 : -6;
  t += s.px > s.sma200 ? 7 : -7;
  t += s.sma50 > s.sma200 ? 5 : -5;
  parts.trend = t;
  let m = 0;
  m += s.hist > 0 ? 8 : -8;
  m += s.hist > s.histPrev ? 5 : -5;

${row('Momentum', '±25', 'MACD histogram positive ±8; histogram higher than yesterday ±5; MACD line above zero ±4; 60-day return ÷ 4, capped at ±8.')}
${row('RSI regime', '−12…+12', 'RSI 55–70: +12 (healthy uptrend) · 50–55: +6 · 70–78: +5 (hot but strong) · above 78: −3 (overheated) · 45–50: −6 · 35–45: −12 (weak) · 30–35: −8 · below 30: −3 (washed out).')}
${row('Relative strength', '±15', '60-day return minus the market index’s, ÷ 3 (capped ±8); 20-day return minus the sector index’s, ÷ 2 (capped ±7). Beating the market matters more than rising.')}
${row('Position', '±10', 'Within 5% of the 52-week high +6, within 15% +2, more than 30% below −6, otherwise −2; breaking the 20-day high +4 on above-average volume but only +2 without it; sitting at the 20-day low −4.')}
${row('Volume', '±4', 'Last session’s volume above 1.3× its 20-day average: +4 if the session closed up, −4 if it closed down. Conviction confirms the move.')}
${row('Trend slope', '±4', 'The 20-day average itself is higher than 5 sessions ago +4, lower −4. A flattening average fails both.')}
${row('Persistence', '±4', '20-, 60- and 120-day returns all positive +4; all negative −4. Rewards trends that have lasted, not one-week pops.')}
${row('Market regime', '+2 / −6', 'The market index (SPY / NIFTY 50) above its own 200-day average +2; below it −6. Most stocks follow their market, so buys are penalised in a falling one.')}
${row('Trend template', '±6', 'The 8-point stage-2 checklist below: 7–8 points +6, 0–3 points −6. A stock scoring Top Buy with fewer than 6 of 8 is held at Buy — the template is the gate to the top rating.')}
${row('Setup tightness', '+4', 'Within 15% of the 52-week high with a 10-day range tighter than 2.5× ATR: a coiled consolidation near highs, the lowest-risk entry shape.')}
${row('Extension', '−6 / +4', 'More than 3× ATR above the 20-day average −6 (chasing risk); more than 3× ATR below +4 (oversold stretch).')}
</table>
<div style="margin-top:10px"><b>The trend template</b> (8 points, shown per stock in the drill-down): price above the 100- and 200-day averages; 100-day above the 200-day; 50-day above both; price above the 50-day; the 100-day rising for at least a month; at least 25% above the 52-week low; within 25% of the 52-week high; beating the market index over 60 or 120 days.</div></div>
<div class="card"><h3>3 · Rating bands</h3>
<table><tr><th>Rating</th><th>Score</th><th>Meaning</th></tr>
${row(pill('Top Buy'), '≥ +60', 'Strong uptrend on nearly every rule, and at least 6 of 8 trend-template points. The entry plan is active.')}
${row(pill('Buy'), '+25 … +59', 'Uptrend with some flaws. Entry plan active; be choosier on price.')}
${row(pill('Hold'), '−24 … +24', 'No edge either way. The plan gives a buy trigger (close above the 20-day high) and a weakness trigger (close below the 20-day low) and says wait.')}
${row(pill('Sell'), '−59 … −25', 'Downtrend. Avoid new buys; reduce into bounces toward the 20-day average.')}
${row(pill('Top Sell'), '≤ −60', 'Broken on nearly every rule. Exit-focused plan only.')}

<div class="card"><h3>4 · Entry, stop and targets (buy-rated stocks)</h3>

<li><b>Stop</b> — entry − 2× ATR, tightened to just under the 10-day low when that is closer, and never wider than 3× ATR. ATR is the stock’s own daily range, so volatile stocks get wider stops. When the stop sits more than 8% below entry the plan says so and tells you to halve the size or skip — the classic max-loss rule.</li>
<li><b>Targets</b> — Target 1 at +1.5× the risk (entry−stop), Target 2 at +3×. Take partial profit at Target 1, then trail the rest under the 10-day low.</li>
<li><b>Exit</b> — a close below the stop, or a close below the 20-day average with a negative MACD histogram. Sell-rated stocks re-qualify only after a close back above the 50-day average with a positive histogram.</li>

Each industry’s score blends the average score of its member stocks (60%) with the sector index’s own score (40%) — XLK-style sector ETFs for the US, NIFTY sector indexes for India. Where Yahoo has no usable sector index (India’s Energy, Auto, FMCG and Metals groups), the member average is used alone. Breadth = share of members above their 50-day average. Click any industry card to filter the signal board to it.</div>
<div class="card"><h3>6 · Call tracking (how to judge this page before investing)</h3>
The day a stock’s rating first appears, its price is locked in as the <b>call price</b>. From then on, <b>since call</b> = change from the call price to the price at your latest refresh. Green means the stock is moving the way the call said — up for Buy calls, <i>down</i> for Sell calls — and anything moving the other way is tagged <b>against</b>. The “Calls so far” card totals this per market, and each drill-down shows the current call plus the one before it. When a rating changes, a new call price is locked the same day. Watch these numbers for several days before committing money — and remember a few days is a short test for trend rules that play out over weeks.</div>
<div class="card"><h3>7 · Wall Street analyst consensus</h3>
Beside the page’s own rules, every covered stock shows the consensus of the professional analysts who follow it (source: Yahoo Finance): the average of all current ratings (Strong buy … Strong sell), how many analysts cover it, their average 12-month price target with the upside or downside to it, and the full ratings split in the drill-down. This is kept separate from the score on purpose — when the rules and the street lean the same way the case is stronger; when they disagree, be careful and dig in. Ranked “top analyst” leaderboards are paid products (TipRanks and the like), so this page uses the full consensus, which includes those analysts’ ratings among all the others. Analyst data is a baked-in snapshot; it moves slowly, mostly after earnings.</div>
<div class="card"><h3>8 · The moving-average box</h3>
Type any number of days (2–${DATA.maxN}) and pick SMA (simple average) or EMA (weights recent days more). Every table gets a column comparing price to that average, with “crossed up / crossed down” tags on the day price moves through it, and the drill-down chart draws it.</div>
<div class="card"><h3>9 · Portfolio and watchlist</h3>
The <b>Portfolio</b> tab stores your actual holdings — ticker, share count and average buy price — in this browser. <b>My tickers</b> is the lighter watchlist: symbols you follow without owning. A portfolio symbol outside the tracked universe is downloaded on the next refresh.</div>
<div class="card"><h3>10 · Where these rules come from</h3>
The rule set follows the most widely taught momentum methods rather than anything invented here: Mark Minervini’s stage-2 trend template (the 8-point checklist above), Stan Weinstein’s stage analysis (the market-regime and long-average rules), William O’Neil’s volume-confirmation principles (breakouts need volume), and the tight-consolidation breakout tactics popularised by Kristjan “Qullamaggie” Kullamagi — coiled ranges near highs, stops near the breakout low, risk kept to a few percent. Entry zones, 2× ATR stops and 1.5R/3R targets are standard swing-trading risk practice. These are disciplines, not predictions.</div>
<div class="card"><h3>11 · What this page deliberately does not do</h3>
<ul><li>The score itself uses no fundamentals, earnings dates or news — price, volume and trend only. Analyst consensus is shown beside it as an independent view, never mixed into the score.</li>
<li>Long-biased: Sell means “avoid / exit”, not a short-selling plan.</li>
<li>The rules are a transparent screen, <b>not back-tested</b> and not a forecast; Yahoo’s free feed is unofficial and can be delayed ~15 minutes.</li>
<li>It never places orders and nothing here is financial advice.</li></ul>

</div>`;

function candleChart(s, a, extra, nShow, style) {
  const flat = s.bars, all = [];

  const s50 = smaSeries(s.closes, 50).slice(-n);
  s50.forEach(v => { if (v != null) vals.push(v); });

  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx - mn) || 1;
  const x = i => padL + (i + 0.5) / n * (w - padL - padR);
  const y = v => 8 + (1 - (v - mn) / rg) * (hP - 16);
  const cw = Math.max(1.4, (w - padL - padR) / n * 0.62);
  const vmax = Math.max(...B.map(b => b[3])) || 1;
  let svg = `<svg id="csvg" viewBox="0 0 ${w} ${H}" width="100%" role="img" aria-label="Candlestick chart with volume" style="display:block">`;
  [0, .5, 1].forEach(t => { const v = mn + rg * t; svg += `<line x1="${padL}" x2="${w - padR}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" stroke-opacity=".08"/><text x="${w - padR + 4}" y="${y(v) + 4}" font-size="10" fill="currentColor" fill-opacity=".55">${fmt(v, v >= 1000 ? 0 : 2)}</text>`; });
  ex2.forEach(e => {
    if (e.band) svg += `<rect x="${padL}" width="${w - padL - padR}" y="${y(Math.min(e.band[1], mx))}" height="${Math.max(1, y(Math.max(e.band[0], mn)) - y(Math.min(e.band[1], mx)))}" fill="${e.color}" fill-opacity=".12"/>`;
    else if (e.v >= mn && e.v <= mx) svg += `<line x1="${padL}" x2="${w - padR}" y1="${y(e.v)}" y2="${y(e.v)}" stroke="${e.color}" stroke-width="1.1" stroke-dasharray="${e.dash || '5 4'}"/><text x="${padL + 4}" y="${Math.max(10, y(e.v) - 3)}" font-size="10" fill="${e.color}">${e.label || ''}</text>`;
  });
  const poly = ser => ser.map((v, i) => v == null ? null : x(i).toFixed(1) + ',' + y(v).toFixed(1)).filter(Boolean).join(' ');
  svg += `<polyline fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="1.1" stroke-dasharray="2 4" points="${poly(s50)}"/>`;
  if (maSer) svg += `<polyline fill="none" stroke="var(--accent)" stroke-width="1.6" points="${poly(maSer)}"/>`;
  for (let i = 0; i < n; i++) {
    const [o, h2, l2, v] = B[i], c = C[i], up = c >= o, col = up ? 'var(--tb)' : 'var(--ts)', X = x(i);
    if (style !== 'line') {
      svg += `<line x1="${X.toFixed(1)}" x2="${X.toFixed(1)}" y1="${y(h2).toFixed(1)}" y2="${y(l2).toFixed(1)}" stroke="${col}" stroke-width="1"/>`;
      const yo = y(Math.max(o, c)), hB = Math.max(1, Math.abs(y(o) - y(c)));
      svg += `<rect x="${(X - cw / 2).toFixed(1)}" y="${yo.toFixed(1)}" width="${cw.toFixed(1)}" height="${hB.toFixed(1)}" fill="${col}" rx="0.5"/>`;
    }
    svg += `<rect x="${(X - cw / 2).toFixed(1)}" y="${(hP + 8 + (1 - v / vmax) * (hV - 4)).toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(1, (v / vmax) * (hV - 4)).toFixed(1)}" fill="${col}" fill-opacity=".45"/>`;
  }
  if (style === 'line') {
    const lcol = C[n - 1] >= C[0] ? 'var(--tb)' : 'var(--ts)';
    svg += `<polyline fill="none" stroke="${lcol}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" points="${C.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ')}"/><circle cx="${x(n - 1).toFixed(1)}" cy="${y(C[n - 1]).toFixed(1)}" r="3" fill="${lcol}"/>`;
  }
  if (dd.length === n) [0, Math.floor(n / 2), n - 1].forEach(i => { svg += `<text x="${x(i).toFixed(1)}" y="${H - 4}" font-size="10" fill="currentColor" fill-opacity=".55" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${dShort(dd[i] * 1000)}</text>`; });
  svg += `<line id="xh" y1="4" y2="${hP + hV + 8}" stroke="currentColor" stroke-opacity=".35" visibility="hidden"/></svg>`;
  return {svg, B, C, n, dd, w, padL, padR};
}
function bindChart(info) {

  const recHtml = rc ? `<div class="plan"><b>This call so far</b><div class="lv">${lvBox('Rated ' + rc.rating + ' since', dFull(rc.at))}${lvBox('Price at call', cur + fmt(rc.px))}${lvBox('Price at last refresh', cur + fmt(s.px))}${lvBox('Change since call', sgn(rc.chg) + '%' + (rc.good === null ? '' : rc.good ? ' · with the call' : ' · against the call'))}</div>${rc.prev ? `<div class="mut" style="font-size:12px;margin-top:6px">Previous call: ${esc(rc.prev.rating)} at ${cur}${fmt(rc.prev.px)} (${dFull(rc.prev.at)}).</div>` : `<div class="mut" style="font-size:12px;margin-top:6px">The call price is locked on the day a rating first appears, so you can watch the signal for a few days before acting.</div>`}</div>` : '';
  const an = anOf(s), agree = anAgrees(s, an);
  const segs = an ? [['Strong buy', an.sb, 'var(--tb)'], ['Buy', an.b, 'var(--b)'], ['Hold', an.h, 'var(--h)'], ['Sell', an.sl, 'var(--s)'], ['Strong sell', an.ss, 'var(--ts)']].filter(x => x[1] > 0) : [];
  const anAt = (liveDocs.AN && liveDocs.AN.at) || DATA.anAt || Date.now();
  const anHtml = an ? `<div class="plan"><b>What Wall Street analysts say</b>
<div class="lv">${lvBox('Consensus of ' + an.n + ' analysts', an.key || '–')}${an.tM ? lvBox('Average 12-mo target', cur + fmt(an.tM)) : ''}${an.up != null ? lvBox('To average target', sgn(an.up) + '%') : ''}${an.tL && an.tH ? lvBox('Target range', fmt(an.tL) + '–' + fmt(an.tH)) : ''}</div>
${segs.length ? `<div class="anbar">${segs.map(x => `<i style="flex:${x[1]};background:${x[2]}" title="${x[0]}: ${x[1]}"></i>`).join('')}</div>
<div class="legend">${segs.map(x => `<span><i style="background:${x[2]}"></i>${x[0]} ${x[1]}</span>`).join('')}</div>` : ''}
${agree === null ? '' : `<div style="margin-top:8px;font-size:12.5px" class="${agree ? 'pos' : 'neg'}">${agree ? 'Analysts lean the same way as this rating — the case is stronger.' : 'Analysts disagree with this rating — extra caution warranted.'}</div>`}
<div class="mut" style="font-size:11.5px;margin-top:6px">Yahoo Finance analyst consensus, pulled ${dFull(anAt)}. Targets are 12-month views and skew optimistic; a second opinion, not truth.</div></div>` : '';
  let lv;
  if (p.kind === 'long') lv = lvBox('Entry zone', fmt(p.entryLo) + '–' + fmt(p.entryHi)) + lvBox('Stop', fmt(p.stop)) + lvBox('Target 1 (1.5R)', fmt(p.t1)) + lvBox('Target 2 (3R)', fmt(p.t2)) + lvBox('Risk to stop', fmt(p.riskPct, 1) + '%') + lvBox('Daily range (ATR)', fmt(p.atr));
  else if (p.kind === 'exit') lv = lvBox('Weak below', fmt(p.exitBelow)) + lvBox('Re-qualify above', fmt(p.reclaim)) + lvBox('Bounce ceiling', fmt(s.sma20)) + lvBox('Daily range (ATR)', fmt(p.atr));
  else lv = lvBox('Buy trigger', '> ' + fmt(p.buyTrigger)) + lvBox('Weakness trigger', '< ' + fmt(p.sellTrigger)) + lvBox('50-day avg', fmt(s.sma50)) + lvBox('Daily range (ATR)', fmt(p.atr));
  const parts = Object.entries(s.parts).map(([k, v]) => { const w = Math.min(50, Math.abs(v) * 2.5); return `<div class="pr"><span class="mut">${k}</span><div class="b"><i style="${v >= 0 ? `left:50%;width:${w}%;background:var(--tb)` : `right:50%;width:${w}%;background:var(--ts)`}"></i></div><b class="${v >= 0 ? 'pos' : 'neg'}">${v >= 0 ? '+' : ''}${fmt(v, 0)}</b></div>`; }).join('');
  const peers = (m && s.industry && !s.custom) ? m.stocks.filter(x => x.industry === s.industry && x.sym !== s.sym).sort((x, y) => y.score - x.score).map(x => `<button class="peer" data-p="${esc(x.sym)}" type="button">${esc(showSym(x.sym))} <span class="${x.score >= 0 ? 'pos' : 'neg'}">${x.score}</span></button>`).join('') : '';
  const f = m ? fresh(m) : {level: 'fresh'};
  const ci = s.bars ? candleChart(s, a, extra, TFN[tf] || 66, cstyle) : null;
  const tfRow = ci ? `<div class="tfrow">${['1M', '3M', 'Max'].map(k => `<button class="chip ${tf === k ? 'on' : ''}" data-tf="${k}" type="button">${k === 'Max' ? '3M+' : k}</button>`).join('')}<span style="flex:1"></span><button class="chip ${cstyle === 'candle' ? 'on' : ''}" data-cs="candle" type="button">Candles</button><button class="chip ${cstyle === 'line' ? 'on' : ''}" data-cs="line" type="button">Line</button></div>` : '';
  $('#dc').innerHTML = `<div class="dh"><div><div style="font-size:20px;font-weight:700">${esc(showSym(s.sym))} <span class="mut" style="font-size:14px;font-weight:400">${esc(s.name)}</span></div>
<div style="margin-top:4px">${pill(s.rating)} <span class="mut">score ${s.score} · ${esc(s.industry)}</span></div>
<div class="big" style="margin-top:6px">${cur}${fmt(s.px)} <span class="${s.chg >= 0 ? 'pos' : 'neg'}" style="font-size:14px">${sgn(s.chg)}% on the day</span></div></div><button class="x" aria-label="Close" id="cl">×</button></div>
<div class="dbody">
${tfRow}<div class="chartwrap" id="cw">${ci ? ci.svg : chart(s, a, extra)}<div id="ctip"></div></div>
<div class="legend">${ci && cstyle !== 'line' ? '<span><i style="background:var(--tb)"></i>Closed up</span><span><i style="background:var(--ts)"></i>Closed down</span>' : ci ? '<span>Line of daily closes; volume below</span>' : `<span><i style="background:${s.closes[s.closes.length - 1] >= s.closes[0] ? 'var(--tb)' : 'var(--ts)'}"></i>Daily close</span>`}<span><i style="background:var(--accent)"></i>${maN}-day ${maT}</span><span>Dotted: 50-day average</span>${p.kind === 'long' ? '<span style="color:var(--tb)">Shaded band: entry zone</span>' : ''}</div>
${recHtml}${anHtml}<div class="lp"><b>Live price check</b><div class="mut" style="font-size:12px;margin:2px 0 8px">Prices on this page are a snapshot. Type the price you see right now to test it against this plan and the ${maN}-day ${maT}.</div>
<div class="row"><label class="mut" style="font-size:12px">Live price (${cur})<br><input id="lpx" type="number" step="any" inputmode="decimal" value="${s.px}"></label>
<label class="mut" style="font-size:12px">Money you'd risk (${cur})<br><input id="lrisk" type="number" step="any" inputmode="decimal" value="${load('sd-risk', 100)}"></label></div>
<div class="status" id="lst"></div><div class="mut" id="lsz" style="font-size:12px;margin-top:4px"></div></div>
<div class="plan"><b>${p.kind === 'long' ? 'Plan: when to enter' : p.kind === 'exit' ? 'Plan: avoid or exit' : 'Plan: wait'}</b><div style="margin-top:4px">${esc(p.note)}${p.warn ? ' <b class="neg">' + esc(p.warn) + '</b>' : ''}</div><div class="lv">${lv}</div><b>When to exit</b><div style="margin-top:4px">${esc(p.exit)}</div></div>
<b>Why this rating</b><ul class="why">${s.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
<div class="parts">${parts}</div>
<div style="margin-top:12px"><b>Trend template ${s.tpl ? s.tpl.pass : 0}/8</b><span class="mut" style="font-size:12px"> (Minervini-style stage-2 checklist)</span><div class="tplg">${(s.tpl ? s.tpl.items : []).map(x => `<span class="${x[1] ? 'pos' : 'neg'}">${x[1] ? '✓' : '✗'}</span><span class="${x[1] ? '' : 'mut'}">${x[0]}</span>`).join('')}</div></div>
<div style="margin-top:12px">
<div class="kv"><span>${maN}-day ${maT}</span><b>${a ? fmt(a.v) + ' (' + (a.above ? 'price above by ' : 'price below by ') + fmt(Math.abs(a.diff)) + '%)' : 'not enough history'}</b></div>
<div class="kv"><span>SMA 20 / 50 / 100 / 200</span><b>${fmt(s.sma20)} / ${fmt(s.sma50)} / ${fmt(s.sma100)} / ${fmt(s.sma200)}</b></div>
<div class="kv"><span>52-week range</span><b>${fmt(s.lo52)} – ${fmt(s.hi52)}</b></div>
<div class="kv"><span>MACD / signal / histogram</span><b>${fmt(s.macd)} / ${fmt(s.macdSig)} / ${fmt(s.hist)}</b></div>
<div class="kv"><span>Returns 5d / 20d / 60d / 120d</span><b>${sgn(s.r5)}% / ${sgn(s.r20)}% / ${sgn(s.r60)}% / ${sgn(s.r120)}%</b></div>
<div class="kv"><span>Last-session volume vs 20-day avg</span><b>${s.rv ? fmt(s.rv, 2) + '×' : 'n/a'}</b></div></div>
${peers ? `<div style="margin-top:12px"><b>Same industry</b><div class="peers" id="peers">${peers}</div></div>` : ''}
<div class="mut" style="font-size:12px;margin-top:12px">Indicator readout from public daily data. Not advice. Size a position so a stop-out costs an amount you accept.</div>
<button class="btn ghost" id="cl2" type="button" style="width:100%;margin-top:12px">← Back to the board</button></div>`;
  const d = $('#dlg');
  if (!d.open) { d.showModal(); try { history.pushState({dlg: 1}, ''); dlgHist = true; } catch (e) {} }
  $('#cl').addEventListener('click', () => d.close());
  const c2 = $('#cl2'); if (c2) c2.addEventListener('click', () => d.close());
  const upd = () => {
    const v = parseFloat($('#lpx').value), r = parseFloat($('#lrisk').value);
    if (!v || v <= 0) { $('#lst').textContent = ''; $('#lsz').textContent = ''; return; }
    let t = '', k = 'mut';
    if (p.kind === 'long') {
      if (v <= p.stop) { t = 'Below the stop. This setup is invalid at that price.'; k = 'neg'; }
      else if (v >= p.t2) { t = 'Past Target 2. Consider taking profit rather than entering.'; k = 'pos'; }
      else if (v >= p.t1) { t = 'Past Target 1. Too late to enter; manage an existing position.'; k = 'pos'; }
      else if (v >= p.entryLo && v <= p.entryHi * 1.002) { t = 'Inside the entry zone. The plan is actionable here.'; k = 'pos'; }
      else if (v > p.entryHi) { t = 'Above the zone by ' + fmt(pct(v, p.entryHi)) + '%. Wait for a pullback to ' + fmt(p.entryLo) + '–' + fmt(p.entryHi) + '.'; k = 'mut'; }
      else { t = 'Below the zone but above the stop. It is weaker than planned; wait for it to hold ' + fmt(p.entryLo) + '.'; k = 'neg'; }
      if (r > 0) { const per = v - p.stop; $('#lsz').textContent = (per > 0 && v < p.t1) ? `Risking ${cur}${fmt(r)} with a stop at ${fmt(p.stop)} means about ${Math.floor(r / per)} shares (${cur}${fmt(per)} risk per share).` : ''; save('sd-risk', r); }
    } else if (p.kind === 'exit') { t = v > p.reclaim ? 'Back above the 50-day average (' + fmt(p.reclaim) + '). Re-check the rating.' : 'Still below the level needed to re-qualify (' + fmt(p.reclaim) + ').'; k = v > p.reclaim ? 'pos' : 'neg'; $('#lsz').textContent = ''; }
    else { t = v > p.buyTrigger ? 'Above the buy trigger (' + fmt(p.buyTrigger) + '). Needs a close above it to confirm.' : v < p.sellTrigger ? 'Below the weakness trigger (' + fmt(p.sellTrigger) + ').' : 'Between the triggers. No edge.'; k = v > p.buyTrigger ? 'pos' : v < p.sellTrigger ? 'neg' : 'mut'; $('#lsz').textContent = ''; }
    if (a) t += '  Versus the ' + maN + '-day ' + maT + ' (' + fmt(a.v) + '): ' + (v > a.v ? 'above' : 'below') + ' by ' + fmt(Math.abs(pct(v, a.v))) + '%.';
    if (f.level !== 'fresh') t += '  (Snapshot is ' + (f.level === 'stale' ? 'stale' : 'ageing') + '.)';
    $('#lst').className = 'status ' + k; $('#lst').textContent = t;
  };
  $('#lpx').addEventListener('input', upd); $('#lrisk').addEventListener('input', upd); upd();
  if (ci) bindChart(ci);
  document.querySelectorAll('[data-tf]').forEach(el => el.addEventListener('click', () => { tf = el.dataset.tf; save('sd-tf', tf); openDetail(sym, code); }));
  document.querySelectorAll('[data-cs]').forEach(el => el.addEventListener('click', () => { cstyle = el.dataset.cs; save('sd-cs', cstyle); openDetail(sym, code); }));
  const pe = $('#peers'); if (pe) pe.addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) openDetail(b.dataset.p, code); });
}
$('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') e.target.close(); });
$('#dlg').addEventListener('close', () => { if (dlgHist) { dlgHist = false; try { history.back(); } catch (e) {} } });
window.addEventListener('popstate', () => { const d = $('#dlg'); if (d.open) { dlgHist = false; d.close(); } });

$('#foot').innerHTML = `<b>How this works.</b> The <b>Rules</b> tab spells out every rule on this page: the full scoring table, rating bands, entry/stop/target construction, industry blending and call tracking. Signals are rule-based readouts of public daily data — a screen, not a forecast, and not financial advice. The page places no orders.`;
renderAll(); refreshInfo();
setInterval(chrome, 60000);
</script>
</body>
</html>
