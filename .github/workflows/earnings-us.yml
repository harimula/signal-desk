name: earnings-us
# The US earnings calendar the bot's news guard reads (data/earnings-us.json): each symbol's next scheduled report date.
# Nightly after the close; a failed night keeps yesterday's file and the report inside the json says why.
on:
  schedule:
    - cron: '20 22 * * 1-5'   # 5:20 PM New York in winter, 6:20 in summer — after the close, before seasonality-data
  push:
    branches: [main]
    paths: ['tools/earnings-us.mjs', '.github/workflows/earnings-us.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earnings-us
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - run: node tools/earnings-us.mjs
        timeout-minutes: 16
      - if: always()               # a timed-out fetch still publishes whatever it got
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/earnings-us.json
          git diff --cached --quiet && exit 0
          git commit -m "US earnings calendar"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || git rebase --abort
            sleep 3
          done
          git push
