name: refresh-prices
on:
  schedule:
    - cron: '*/10 13-21 * * 1-5'   # every 10 min, US market hours (UTC)
    - cron: '*/15 3-10 * * 1-5'    # India session
  workflow_dispatch:
permissions:
  contents: write
  actions: write      # tools/kick-bot.mjs may start paper-trade-bot
concurrency:
  group: refresh-prices      # a slow run never overlaps the next one
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Make sure a trading session is running (GitHub's own schedule can skip it)
        run: node tools/kick-bot.mjs || true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - run: node fetch.mjs
      - run: node news.mjs || true
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add live.json
          [ -f news.json ] && git add news.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh prices"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || git rebase --abort
            sleep 3
          done
          git push
