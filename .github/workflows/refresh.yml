name: refresh-prices
on:
  schedule:
    - cron: '*/10 13-21 * * 1-5'   # every 10 min, US market hours (UTC)
    - cron: '*/15 3-10 * * 1-5'    # India session
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node fetch.mjs
      - run: node news.mjs || true
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add live.json
          [ -f news.json ] && git add news.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh prices"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || git rebase --abort
            sleep 3
          done
          git push
