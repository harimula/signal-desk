name: research-data
# Manual: downloads the price history for the win-rate study (tools/research-data.mjs) and pushes it to the separate
# `research-data` branch. Nothing on main changes; the bot and the site never read that branch.
on:
  workflow_dispatch:
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: node tools/research-data.mjs
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan research-data
          git rm -rf --cached . > /dev/null
          git add -f research-data/*.json.gz
          git commit -m "Price history for the win-rate study"
          git push -f origin research-data
