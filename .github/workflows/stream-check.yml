name: preflight-check
# Safe any time, also on weekends: signs in to the broker, the three live streams and the Pause switch, and reports
# OK/FAIL for each. Places, changes and cancels nothing. Run it from Actions → preflight-check → Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - run: node tools/stream-check.mjs
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
