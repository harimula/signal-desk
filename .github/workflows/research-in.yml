name: strategy-research-india
# The US strategy (RSI-2 dip buying and the alternatives) replayed on NSE stocks: Nifty 100, Nifty 50 benchmark,
# 0.15% per side for Indian costs. Writes bot/research-in.json and bot/research_in_report.md (shown on the site).
on:
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: node bot/research.mjs
        env:
          BT_MARKET: IN
      - run: node bot/research-in-ideas.mjs
        continue-on-error: true
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/research_in_report.md bot/research-in.json bot/research-in-ideas.json bot/research_in_ideas.md
          git diff --cached --quiet && exit 0
          git commit -m "Strategy research report (India)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X ours origin main || git rebase --abort; sleep 3; done
