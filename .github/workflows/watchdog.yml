name: watchdog
on:
  schedule:
    - cron: '*/15 13-21 * * 1-5'     # every 15 min; 13-21 UTC covers 9:30–16:00 ET in both summer and winter time (the script checks ET hours itself)
  workflow_dispatch:
permissions:
  contents: read
  actions: write      # restarts paper-trade-bot when no session is running
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - run: node bot/watchdog.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - name: Restart the trading session if none is running (GitHub's own schedule can skip it)
        if: always()
        run: node tools/kick-bot.mjs || true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
