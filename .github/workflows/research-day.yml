name: day-trading-research
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'      # first of the month, 06:17 UTC: refresh the study with the latest month of bars
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - run: node bot/research-day.mjs
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/research_day_report.md bot/research-day.json
          git diff --cached --quiet && exit 0
          git commit -m "Day-trading research report"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X ours origin main || git rebase --abort; sleep 3; done
