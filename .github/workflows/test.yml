name: bot-tests
on:
  push:
    paths: ['bot/**', 'news.mjs', 'fetch.mjs', 'tools/**', 'index.html', 'ver.txt', 'eslint.config.js', 'package.json', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - name: Site stamp (build number + CSP hashes) and inline-script syntax
        run: npm run check
      - name: Lint bot and tools
        run: npm run lint
      - name: Unit tests
        run: node bot/test.mjs
      - name: Order tests against a fake broker
        run: node bot/test-orders.mjs
