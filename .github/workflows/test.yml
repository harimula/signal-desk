name: bot-tests
on:
  push:
    paths: ['bot/**', 'news.mjs', 'fetch.mjs', 'earnings-in.mjs', 'tools/**', 'index.html', 'tips.js', 'sort.js', 'retire.html', 'rentemi.html', 'ver.txt', 'eslint.config.js', 'package.json', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - name: Site stamp (build number + CSP hashes) and inline-script syntax
        run: npm run check
      - name: Lint bot and tools
        run: npm run lint
      - name: Unit tests
        run: node bot/test.mjs
      - name: Order tests against a fake broker
        run: node bot/test-orders.mjs
      - name: India simulation tests
        run: node bot/test-india.mjs
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - name: Headless Chromium
        run: npm i --no-save playwright@1.49.1 libsodium@0.7.13 libsodium-wrappers@0.7.13 && npx playwright install --with-deps chromium
      - name: Page tests (every tab, CSP, settings save)
        run: node tools/page-test.mjs
