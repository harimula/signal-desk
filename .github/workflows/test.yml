name: bot-tests
on:
  push:
    paths: ['bot/**', 'news.mjs', 'fetch.mjs', 'tools/**', 'index.html', 'tips.js', 'retire.html', 'rentemi.html', 'ver.txt', 'eslint.config.js', 'package.json', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Site stamp (build number + CSP hashes) and inline-script syntax
        run: npm run check
      - name: Lint bot and tools
        run: npm run lint
      - name: Unit tests
        run: node bot/test.mjs
      - name: Order tests against a fake broker
        run: node bot/test-orders.mjs
      - name: India simulation tests
        run: node bot/test-india.mjs
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Headless Chromium
        run: npm i --no-save playwright@1.49.1 libsodium@0.7.13 libsodium-wrappers@0.7.13 && npx playwright install --with-deps chromium
      - name: Page tests (every tab, CSP, settings save)
        run: node tools/page-test.mjs
