name: bot-tests
on:
  push:
    paths: ['bot/**', 'news.mjs', '.github/workflows/test.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node bot/test.mjs
