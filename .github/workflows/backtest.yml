name: backtest
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Years of history'
        default: '40'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: node bot/backtest.mjs
        env:
          BT_YEARS: ${{ github.event.inputs.years }}
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/backtest_report.md bot/backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "Backtest report"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X ours origin main || git rebase --abort; sleep 3; done
