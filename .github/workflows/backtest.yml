name: backtest
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Years of history'
        default: '40'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: node bot/backtest.mjs
        env:
          BT_YEARS: ${{ github.event.inputs.years }}
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/backtest_report.md bot/backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "Backtest report"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X ours origin main || git rebase --abort; sleep 3; done
