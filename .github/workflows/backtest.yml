name: backtest
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Years of history'
        default: '40'
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node bot/backtest.mjs
        env:
          BT_YEARS: ${{ github.event.inputs.years }}
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/backtest_report.md
          git diff --cached --quiet && exit 0
          git commit -m "Backtest report"
          git pull --rebase -X ours origin main || true
          git push
