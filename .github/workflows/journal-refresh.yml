name: journal-refresh
# Manual: one bot check that only reads the account and rewrites the (encrypted) journal — e.g. to fill a new Bot trades
# card at the weekend. It runs read-only (BOT_READONLY): it places, changes and cancels nothing, even if started while the
# market is open or while the page's Pause is set. Shares the session's queue, so it never runs at the same time as a
# trading session; it pulls first, because a run that waited in the queue was checked out when it was started.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-trade-bot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: |
          git pull -q --ff-only origin main || true
          node bot/bot.mjs
        env:
          BOT_READONLY: '1'
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          JOURNAL_KEY: ${{ secrets.JOURNAL_KEY }}
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/journal.json
          git diff --cached --quiet && exit 0
          git commit -m "Bot journal (refresh)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase --autostash -X theirs origin main || git rebase --abort; sleep 3; done
          git push
