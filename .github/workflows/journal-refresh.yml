name: journal-refresh
# Manual: one bot check that only reads the account and rewrites the (encrypted) journal — e.g. to fill a new Bot trades
# card at the weekend. With the market closed it places, changes and cancels nothing. Shares the session's queue, so it
# never runs at the same time as a trading session.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-trade-bot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - run: |
          node bot/bot.mjs
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          JOURNAL_KEY: ${{ secrets.JOURNAL_KEY }}
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/journal.json
          git diff --cached --quiet && exit 0
          git commit -m "Bot journal (refresh)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X theirs origin main || git rebase --abort; sleep 3; done
          git push
