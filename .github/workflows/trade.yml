name: paper-trade-bot
on:
  schedule:
    # Each run stays alive for the session (checks every second). The 5-minute schedule only
    # matters as a backup: while a run is alive the next one waits in the queue and takes over
    # if it ever stops. Outside 9:20-16:05 ET a run exits immediately.
    - cron: '45,50,55 12 * * 1-5'   # early start: the run waits until 9:20 ET (GitHub often fires schedules late)
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  actions: write      # a session that reaches its time limit before the close starts its successor
concurrency:
  group: paper-trade-bot
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          # a run that waited in the queue was checked out when it was queued: bring in the journal, settings and Pause
          # the previous session pushed since, or it would resume from a stale day-state (a Telegram /pause, alerts sent)
          git pull -q --ff-only origin main || git pull -q --rebase origin main || true
          node bot/live.mjs
        env:
          RUN_MINUTES: '345'
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
          JOURNAL_KEY: ${{ secrets.JOURNAL_KEY }}
          JOURNAL_RESET: ${{ vars.JOURNAL_RESET }}   # set the repository variable to 1 for one session to start a new journal after a passphrase change
          GITHUB_TOKEN: ${{ github.token }}   # lets a running session see the page's Pause (bot/STOP) within seconds
      - run: |
          [ -f bot/journal.json ] || exit 0
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/journal.json
          git add bot/scan.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Bot journal"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash -X theirs origin main || git rebase --abort   # --autostash: a Pause removed during the session leaves the checked-out bot/STOP deleted
            sleep 3
          done
          git push
