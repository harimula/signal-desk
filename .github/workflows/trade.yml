name: paper-trade-bot
on:
  schedule:
    # Each run stays alive for the session (checks every second). The 5-minute schedule only
    # matters as a backup: while a run is alive the next one waits in the queue and takes over
    # if it ever stops. Outside 9:20-16:05 ET a run exits immediately.
    - cron: '45,50,55 12 * * 1-5'   # early start: the run waits until 9:20 ET (GitHub often fires schedules late)
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-trade-bot
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          node bot/live.mjs
        env:
          RUN_MINUTES: '345'
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
          JOURNAL_KEY: ${{ secrets.JOURNAL_KEY }}
          BOT_RISK_PCT: ${{ vars.BOT_RISK_PCT }}
          BOT_MAX_HEAT: ${{ vars.BOT_MAX_HEAT }}
          BOT_MAX_PER_SECTOR: ${{ vars.BOT_MAX_PER_SECTOR }}
          BOT_PER_TRADE: ${{ vars.BOT_PER_TRADE }}
          BOT_OPT_BUDGET: ${{ vars.BOT_OPT_BUDGET }}
          BOT_MAX_POSITIONS: ${{ vars.BOT_MAX_POSITIONS }}
          BOT_MAX_OPTIONS: ${{ vars.BOT_MAX_OPTIONS }}
          BOT_HOLD_LOSS: ${{ vars.BOT_HOLD_LOSS }}
          BOT_HOLD_FLOOR: ${{ vars.BOT_HOLD_FLOOR }}
          BOT_TAKE_PROFIT: ${{ vars.BOT_TAKE_PROFIT }}
          BOT_OPT_TAKE_PROFIT: ${{ vars.BOT_OPT_TAKE_PROFIT }}
          BOT_MAX_ENTRIES_PER_SYM: ${{ vars.BOT_MAX_ENTRIES_PER_SYM }}
          BOT_STOCKS: ${{ vars.BOT_STOCKS }}
          BOT_OPTIONS: ${{ vars.BOT_OPTIONS }}
      - run: |
          [ -f bot/journal.json ] || exit 0
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/journal.json
          git add bot/scan.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Bot journal"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || git rebase --abort
            sleep 3
          done
          git push
