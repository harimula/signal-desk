name: option-check
# Manual: replays a sample of the bot's CALL and PUT signals since March 2024 on real option prices (tools/option-check.mjs)
# and pushes the result to the separate research-data branch. Market data only; nothing on main changes.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - run: |
          git fetch -q origin +research-data:refs/remotes/origin/research-data
          mkdir -p research-data
          git show origin/research-data:research-data/daily.json.gz > research-data/daily.json.gz
      - run: node tools/option-check.mjs
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          cp research-data/option-check.json /tmp/option-check.json
          rm -rf research-data
          git checkout -q -B research-data origin/research-data
          cp /tmp/option-check.json research-data/option-check.json
          git add -f research-data/option-check.json
          git commit -q -m "Real-price check of the CALL / PUT exits"
          git push -q origin research-data
