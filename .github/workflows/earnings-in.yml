name: earnings-india
# The India side of the Earnings tab: NSE's results calendar (BSE as the fallback) plus Yahoo's EPS estimates and
# actuals for the big companies, written to earnings-in.json. Hourly from 8:47 AM to 11:47 PM India time, every day
# (Indian companies also report on Saturdays). The script leaves the file alone when nothing changed.
on:
  schedule:
    - cron: '17 3-18 * * *'
  push:                                  # a change to the script refreshes the file at once
    branches: [main]
    paths: ['earnings-in.mjs', '.github/workflows/earnings-in.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earnings-india
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - run: node earnings-in.mjs
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          [ -f earnings-in.json ] || exit 0
          git add earnings-in.json
          git diff --cached --quiet && exit 0
          git commit -m "India earnings calendar"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || git rebase --abort
            sleep 3
          done
          git push
