name: spy-why
# Read-only diagnosis of the SPY quick trades (tools/spy-why.mjs): replays the bot's market check and SPY entry rules on the
# last four trading days' real 1- and 5-minute prices and headlines, checks the quote spread of the contracts it would buy
# now, and pushes research-data/spy-why.json to the separate research-data branch (main is untouched). No orders, no
# settings. Manual, and once on a change to the script or this file.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to replay (YYYY-MM-DD, comma-separated). Empty = the last four trading days'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['tools/spy-why.mjs', '.github/workflows/spy-why.yml']
permissions:
  contents: write
  actions: read          # the trading sessions' own log lines (account part)
concurrency:
  group: spy-why
  cancel-in-progress: false
jobs:
  why:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - run: node tools/spy-why.mjs
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days }}
          # Public half of a key pair whose private half never enters the repository: the account part of the result (orders,
          # equity, session log lines) is sealed to it, because the bot's trades are private. Remove the line to skip that part.
          SEAL_PUB: 
      - run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          cp research-data/spy-why.json /tmp/spy-why.json
          rm -rf research-data
          git fetch -q origin +research-data:refs/remotes/origin/research-data
          git checkout -q -B research-data origin/research-data
          mkdir -p research-data
          cp /tmp/spy-why.json research-data/spy-why.json
          git add -f research-data/spy-why.json
          git diff --cached --quiet && exit 0
          git commit -q -m "SPY quick trades: replay of the entry rules (spy-why)"
          for i in 1 2 3; do
            git push -q origin research-data && exit 0
            git pull -q --rebase origin research-data || git rebase --abort
            sleep 3
          done
          git push -q origin research-data
