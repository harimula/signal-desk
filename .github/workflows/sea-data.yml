name: seasonality-data
on:
  schedule:
    - cron: '40 22 * * 1-5'   # 5:40 PM New York in winter, 6:40 in summer — after the close and after the bot's session
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seasonality-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - run: node tools/macro-fetch.mjs      # the Macro tab's series (FRED + gold/bitcoin) — quick, so it runs first
        timeout-minutes: 14
      - if: always()
        run: node tools/sea-fetch.mjs
        timeout-minutes: 18
      - if: always()               # a timed-out fetch still publishes whatever it got; failed symbols keep yesterday's file
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Seasonality data (nightly site copy)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || git rebase --abort
            sleep 3
          done
          git push
